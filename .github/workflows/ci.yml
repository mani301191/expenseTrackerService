name: build-and-test

# Runs only when a PR is opened or updated - no separate runs for pushes or merges
on:
  pull_request:
    branches:
      - '**'

jobs:
  build:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest

    # Throwaway MongoDB for @SpringBootTest context load (app expects localhost:27018)
    services:
      mongo:
        image: mongo:4.4
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongo --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build jar, run tests and generate JaCoCo coverage
        run: mvn -B -Dspring-boot.jar.outputDir=target clean install

      - name: Upload application jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: ignore

      - name: Generate HTML test report
        if: always()
        run: mvn -B surefire-report:report-only

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-html-report
          path: target/site/surefire-report.html
          if-no-files-found: ignore
